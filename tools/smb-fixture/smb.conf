[global]
   workgroup = HIRARI
   server role = standalone server
   security = user
   map to guest = Bad User
   server min protocol = SMB2_02
   server max protocol = SMB3_11
   server signing = auto
   smb encrypt = desired
   unix charset = UTF-8
   log level = 1
   load printers = no
   disable spoolss = yes

[books]
   path = /srv/books
   valid users = bookworm7
   read only = yes

[sealed]
   path = /srv/books
   valid users = bookworm7
   read only = yes
   smb encrypt = required

[public]
   path = /srv/books
   guest ok = yes
   read only = yes
