# Native dependencies whose sources live under third_party/ (docs/spec.md section 8.5).
# Every directory here needs one [[library]] entry; `./gradlew check` verifies this.
#
# [[library]]
# name = "Display name"
# version = "1.2.3"
# directory = "directory under third_party/"
# url = "where the source archive was downloaded from"
# sha256 = "SHA-256 of that archive, lowercase hex"
# spdx = "SPDX identifiers joined by ' AND ' (for a dual license, the chosen side only)"
# license_file = "license text, relative to the directory"
# public_domain = ["files holding public domain code, relative to the directory"]
#   Required exactly when spdx names LicenseRef-Public-Domain: code whose authors placed it in the public
#   domain, with the notice in the file (docs/spec.md section 8.5).

[[library]]
name = "libarchive"
version = "3.8.11"
directory = "libarchive"
url = "https://github.com/libarchive/libarchive/releases/download/v3.8.11/libarchive-3.8.11.tar.gz"
sha256 = "900fe9fc7237c2b04f090f3c3648de8fe597525771f5035016537ce2d667d12b"
spdx = "BSD-2-Clause AND BSD-3-Clause AND ISC AND Unicode-3.0 AND Apache-2.0 AND 0BSD AND LicenseRef-Public-Domain"
license_file = "COPYING"
public_domain = [
    "libarchive/archive_ppmd7.c",
    "libarchive/archive_ppmd8.c",
    "libarchive/archive_ppmd_private.h",
    "libarchive/archive_ppmd7_private.h",
    "libarchive/archive_ppmd8_private.h",
    "libarchive/archive_read_support_format_7zip.c",
]

